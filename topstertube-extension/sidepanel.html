<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>Topstertube</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="settings-group">
            <div class="setting-item">
                <label>테마 선택</label>
                <select id="theme-select">
                    <option value="2x2">2 x 2</option>
                    <option value="3x3" selected>3 x 3</option>
                    <option value="4x4">4 x 4</option>
                    <option value="5x5">5 x 5</option>
                    <option value="classic">Classic 42</option>
                </select>
            </div>
            <!-- Player URL hidden as requested but kept logically -->
            <input type="hidden" id="core-url" value="https://topstertube.vercel.app/">
        </div>

        <div class="button-group">
            <button id="grab-tab-btn" class="primary-btn">현재 탭 추가</button>
            <button id="clear-all-btn" class="secondary-btn">초기화</button>
        </div>

        <div id="link-list" class="link-list">
            <!-- Dynamic Slots -->
        </div>

        <div class="action-footer">
            <div class="output-actions" aria-label="출력 방식">
                <button id="copy-player-btn" class="generate-btn">링크 복사</button>
                <button id="download-image-btn" class="secondary-btn">이미지 저장</button>
                <button id="copy-image-btn" class="secondary-btn">이미지 링크</button>
                <button id="copy-html-btn" class="secondary-btn">iframe 복사</button>
                <button id="preview-btn" class="secondary-btn">미리보기</button>
            </div>
            <div id="status-msg" class="status-msg"></div>
        </div>
    </div>
    <script src="payload.js"></script>
    <script src="sidepanel.js"></script>
</body>

</html>
